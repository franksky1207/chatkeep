name: ChatKeep Nov27 large-share diagnostics
on:
  push:
    branches: ['feature/v1.2.0-local-html-reader']
    paths: ['.github/workflows/share-nov27-large-json.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Bounded test of supplied large public JSON without printing content
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time, tracemalloc
          from chatkeep import fetch_share_json,find_conversation,normalize
          url='https://chatgpt.com/share/6b09746e-dd24-83e8-85ac-fdadfbb19312'
          t=time.monotonic()
          tracemalloc.start()
          try:
              obj=fetch_share_json(url,max_bytes=64_000_000,timeout=40)
          except Exception as exc:
              msg=str(exc)
              allowed=('分享 JSON 超過大小限制','分享 JSON 來源 HTTP 503','分享 JSON 來源 HTTP 403','分享 JSON 來源讀取失敗','分享 JSON 不支援壓縮回應','分享 JSON 宣告大小無效')
              print('FETCH_ERROR',next((s for s in allowed if s in msg),'OTHER'),'CLASS',type(exc).__name__,flush=True)
              raise SystemExit(0)
          print('FETCH_SECONDS',round(time.monotonic()-t,1),flush=True)
          print('JSON_TYPE',type(obj).__name__,flush=True)
          if isinstance(obj,dict):print('JSON_TOP_KEYS',sorted(obj),flush=True)
          print('PEAK_MEM_MB',round(tracemalloc.get_traced_memory()[1]/1e6,1),flush=True)
          try:
              conv=find_conversation(obj)
              print('CONVERSATION_KEYS',sorted(conv.keys()),flush=True)
              print('MAPPING_LENGTH',len(conv.get('mapping') or {}),flush=True)
              print('LINEAR_LENGTH',len(conv.get('linear_conversation') or []),flush=True)
              normalized=normalize(conv)
              print('NORMALIZED_MESSAGE_COUNT',len(normalized.get('messages') or []),flush=True)
              print('NORMALIZED_VISIBLE_CHARS',sum(len(m.get('text','')) for m in normalized.get('messages') or []),flush=True)
              print('NORMALIZED_ERROR_REASONS',sorted(set(i.get('reason') for i in normalized.get('report',{}).get('issues',[]))),flush=True)
              print('NORMALIZED_JSON_MB',round(len(json.dumps(normalized,ensure_ascii=False).encode())/1e6,1),flush=True)
          except Exception as exc:
              msg=str(exc)
              allowed=('Cannot determine the active conversation branch','Active branch and linear conversation disagree','Broken conversation parent','Decoded stream contains no conversation object','分享頁未包含可匯出的可見訊息','Invalid message metadata')
              print('PARSE_ERROR',next((s for s in allowed if s in msg),'OTHER'),'CLASS',type(exc).__name__,flush=True)
          print('PEAK_MEM_MB_END',round(tracemalloc.get_traced_memory()[1]/1e6,1),flush=True)
          PY
