name: Parser quick checks
on:
  pull_request:
    paths:
      - 'chatkeep.py'
      - 'tests/**'
      - '.github/workflows/parser-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic offline tests
        run: python -m unittest discover -s tests -v
