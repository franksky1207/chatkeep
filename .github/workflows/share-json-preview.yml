name: Verify share JSON preview and live backend
on:
  push:
    branches: ['share-json-download-20261127']
    paths: ['.github/workflows/share-json-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check independent preview assets
        run: |
          BASE="https://raw.githack.com/franksky1207/chatkeep/${GITHUB_SHA}/docs"
          curl -fLsS --retry 2 --max-time 45 "$BASE/index.html" -o /tmp/preview.html
          grep -q 'download-share-json' /tmp/preview.html
          curl -fLsS --retry 2 --max-time 45 "$BASE/local-backup/share-json.mjs" -o /tmp/share-json.mjs
          echo "Preview: $BASE/index.html"
      - name: Verify actual share retrieval and import without logging content
        env:
          SHARE_URL: https://chatgpt.com/share/6b09746e-dd24-83e8-85ac-fdadfbb19312
        run: |
          curl -sS --max-time 100 -H 'Content-Type: application/json' --data "$(node -p 'JSON.stringify({url:process.env.SHARE_URL})')" https://chatkeep.onrender.com/api/share-reader-v1 -o /tmp/share-packet.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {shareBackup} from './docs/local-backup/share-json.mjs';
          import {parseConversation} from './docs/local-backup/reader-core.mjs';
          import {indexBlob} from './docs/local-backup/json-index.mjs';
          const p=JSON.parse(fs.readFileSync('/tmp/share-packet.json','utf8'));
          assert.equal(p.ok,true,p.error?.code||'reader failed');
          const b=shareBackup(p.data,process.env.SHARE_URL);
          const json=JSON.stringify(b);
          assert.equal((await indexBlob(new Blob([json]))).length,1);
          assert.equal(parseConversation(b[0]).messages.length,p.data.messages.length);
          assert.equal(p.data.messages.length,986);
          console.log('Verified messages:',p.data.messages.length,'JSON bytes:',Buffer.byteLength(json));
          EOF
          rm -f /tmp/share-packet.json
