name: ChatKeep Nov27 share regression validation
on:
  push:
    branches: ['fix/nov27-large-shared-conversation']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile modified Python modules
        run: python -m py_compile chatkeep.py official_worker.py json_api.py gunicorn.conf.py rich_word.py word_export.py
      - name: Share parsing and Word regression tests
        run: |
          python -m unittest discover -s tests -p 'test_share_reader.py' -v
          python -m unittest discover -s tests -p 'test_chatkeep.py' -v
          python -m unittest discover -s tests -p 'test_rich_word.py' -v
          python -m unittest discover -s tests -p 'test_word_layout.py' -v
          python -m unittest discover -s tests -p 'test_long_conversations.py' -v
