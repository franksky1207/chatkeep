name: ChatKeep v1.2 reader lightweight checks
on:
  push:
    branches: ['feature/v1.2.0-local-html-reader']
    paths:
      - 'docs/local-backup/reader-*.mjs'
      - 'docs/local-backup/app.mjs'
      - 'docs/index.html'
      - 'tests/reader_core.test.mjs'
      - 'tests/reader_export.test.mjs'
      - '.github/workflows/reader-v12-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and reader unit tests
        run: |
          python3 -m pip install --break-system-packages lxml
          python3 -m unittest discover -s tests -p test_share_reader.py
          python3 -m py_compile server.py json_api.py official_worker.py
          node --check docs/local-backup/app.mjs
          node --check docs/local-backup/reader-core.mjs
          node --check docs/local-backup/reader-worker.mjs
          node --check docs/local-backup/reader-ui.mjs
          node --check docs/local-backup/reader-export.mjs
          node --test tests/reader_core.test.mjs tests/reader_export.test.mjs
          node tests/verify_export_zip.mjs
          python3 -c 'import zipfile; z=zipfile.ZipFile("/tmp/chatkeep-reader-zip-check.zip"); assert z.testzip() is None; assert len(z.namelist())==2; assert "你好" in z.read("第一段.html").decode("utf-8")'
          git diff --check
