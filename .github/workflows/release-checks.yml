name: v1.1 necessary release checks
on:
  push:
    branches: [feat/local-json-extractor, main, fix/cors-preflight-diagnostics]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies and browsers
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium webkit
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import subprocess
          with sync_playwright() as p:
              subprocess.run(['sudo', 'ln', '-sf', p.chromium.executable_path, '/usr/bin/chromium'], check=True)
          PY
          ln -s "$pythonLocation" .venv
      - name: Python API, Word, CORS, compatibility and privacy regressions
        env:
          PYTHONPATH: tests
        run: |
          python -W error::ResourceWarning -m unittest test_pages_cors test_chunk_transfer test_long_conversations test_official_json test_integration test_rich_word test_word_layout test_acceptance test_chatkeep -q
      - name: Node indexing, transfer and download verification
        run: |
          node --test tests/presentation.test.mjs tests/pages_conversion.test.mjs tests/large_transfer.test.mjs tests/large_transfer_worker.test.mjs tests/local_backup.test.mjs tests/local_backup_filters.test.mjs
      - name: Browser UI and local cross-origin download integration
        run: |
          PYTHONPATH=. python tests/cors_browser.py --browser chromium
          PYTHONPATH=. python tests/cors_browser.py --browser webkit
          python tests/ui_security_browser.py
          PYTHONPATH=.:tests python tests/pages_integration_browser.py
          python tests/local_backup_browser.py
      - name: Gunicorn transport, integrity and content privacy
        run: python tests/official_api_transport.py
      - name: Whitespace validation
        run: git diff --check
      # Synthetic fixtures only. Never upload conversations, documents or traces.
